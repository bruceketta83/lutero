<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inchiostro e Tempesta</title>
<meta name="description" content="Gioco di storia su Martin Lutero e la Riforma, per la scuola media.">
<meta name="theme-color" content="#0b0b0b">
<!-- ?v=N: cambia N a ogni versione, così il telefono scarica subito i file nuovi. -->
<link rel="stylesheet" href="fonts/fonts.css?v=20">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div id="app">
  <header id="barra">
    <span id="luogo">Tipografia di Mastro Grunenberg</span>
    <span id="data">Wittenberg, primavera 1517</span>
  </header>
  <nav id="strumenti" aria-label="Strumenti">
    <button id="apri-taccuino" class="strumento" aria-label="Taccuino dello storico">📜 Taccuino</button>
    <button id="apri-lettura" class="strumento" aria-label="Opzioni di lettura">Aa Lettura</button>
  </nav>

  <main id="scena-box">
    <svg id="scena" viewBox="0 0 400 224" preserveAspectRatio="xMidYMid slice" aria-label="Scena di gioco">
      <defs>
        <radialGradient id="luce-grad">
          <stop offset="0" stop-color="#000"/>
          <stop offset="0.55" stop-color="#000" stop-opacity="0.6"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <mask id="buio-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="224">
          <rect width="400" height="224" fill="#fff"/>
          <g id="luci"></g>
        </mask>
        <filter id="alone-oro" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
      </defs>
      <image id="sfondo" x="0" y="0" width="400" height="224" preserveAspectRatio="xMidYMid slice"/>
      <rect id="buio" width="400" height="224" fill="#000" mask="url(#buio-mask)"/>
      <g id="oggetti"></g>
      <g id="personaggi"></g>
      <g id="lena" class="personaggio">
        <image id="lena-img" width="112" height="144"/>
      </g>
      <g id="uscite"></g>
    </svg>
    <button id="mostra-oggetti" class="aiuto" aria-label="Mostra gli oggetti">👁 Oggetti</button>
  </main>

  <div id="foglio-box" hidden>
    <div id="foglio-carta" role="dialog" aria-modal="true" aria-labelledby="foglio-titolo">
      <div id="foglio-titolo"></div>
      <div id="foglio-testo"></div>
      <div class="riga-pulsanti"><button id="foglio-chiudi">Chiudi</button><button class="ascolta" type="button" aria-pressed="false">🔈 Ascolta</button></div>
    </div>
  </div>
  <div id="glossario" hidden role="dialog" aria-modal="true">
    <div id="glossario-carta"><div id="glossario-parola"></div><div id="glossario-testo"></div><div class="riga-pulsanti"><button id="glossario-chiudi">Ho capito</button><button class="ascolta" type="button" aria-pressed="false">🔈 Ascolta</button></div></div>
  </div>
  <div id="mini" hidden role="dialog" aria-modal="true" aria-labelledby="mini-titolo">
    <div id="mini-carta"><div id="mini-titolo"></div><div id="mini-corpo"></div></div>
  </div>
  <div id="taccuino" hidden role="dialog" aria-modal="true" aria-labelledby="taccuino-titolo">
    <div id="taccuino-carta">
      <div id="taccuino-titolo">Taccuino dello storico</div>
      <div class="tac-schede" role="tablist">
        <button type="button" class="tac-scheda on" role="tab" data-scheda="fonti" aria-selected="true">Fonti</button>
        <button type="button" class="tac-scheda" role="tab" data-scheda="linea" aria-selected="false">Linea del tempo</button>
      </div>
      <div id="taccuino-corpo"></div>
      <button id="taccuino-chiudi">Chiudi</button>
    </div>
  </div>
  <div id="lettura" hidden role="dialog" aria-modal="true" aria-labelledby="lettura-titolo">
    <div id="lettura-carta"><div id="lettura-titolo">Opzioni di lettura</div><div id="lettura-corpo"></div><button id="lettura-chiudi">Chiudi</button></div>
  </div>
  <div id="avviso-borsa" aria-live="polite" hidden></div>
  <section id="dialogo" aria-live="polite">
    <div class="dialogo-testa"><div id="chi"></div><button class="ascolta" type="button" aria-pressed="false">🔈 Ascolta</button></div>
    <div id="testo"></div>
    <div id="scelte"></div>
  </section>
</div>
<script src="js/lettura.js?v=20"></script>
<script src="js/stanze.js?v=20"></script>
<script src="js/gioco.js?v=20"></script>
<script src="js/minigiochi.js?v=20"></script>
<script src="js/taccuino.js?v=20"></script>
</body>
</html>
